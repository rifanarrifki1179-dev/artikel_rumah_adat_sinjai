<!DOCTYPE HTML>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tur Virtual Rumah Adat Sinjai</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>
    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: translateY(35px) scale(0.98);
        filter: blur(3px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes pageLeave {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
      to {
        opacity: 0;
        transform: translateY(-35px) scale(0.98);
        filter: blur(3px);
      }
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-transition {
      animation: pageEnter 650ms ease both;
    }

    .page-transition.is-leaving {
      animation: pageLeave 450ms ease both;
    }

    .page-overlay {
      position: fixed;
      inset: 0;
      background: rgba(24, 24, 27, 0);
      pointer-events: none;
      transition: background 450ms ease;
      z-index: 9999;
    }

    .page-overlay.is-active {
      background: rgba(24, 24, 27, 0.08);
    }

    .pressable {
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .pressable:active {
      transform: scale(0.97);
    }

    body.menu-open {
      overflow: hidden;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 300px;
      height: 100vh;
      padding: 110px 24px 24px;
      background: #f7f1e8;
      border-right: 1px solid rgba(245, 158, 11, 0.35);
      box-shadow: 20px 0 50px rgba(120, 53, 15, 0.12);
      transform: translateX(-100%);
      transition: transform 350ms ease;
      z-index: 48;
      overflow-y: auto;
    }

    .side-menu.open {
      transform: translateX(0);
    }

    .menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 24, 27, 0);
      pointer-events: none;
      transition: background 350ms ease;
      z-index: 40;
    }

    .menu-backdrop.open {
      background: rgba(24, 24, 27, 0.22);
      pointer-events: auto;
    }

    .menu-link {
      display: block;
      padding: 14px 16px;
      border-radius: 14px;
      font-weight: 600;
      color: #3f3f46;
      transition: background 250ms ease, color 250ms ease, transform 250ms ease;
    }

    .menu-link:hover {
      background: #fef3c7;
      color: #92400e;
      transform: translateX(4px);
    }

    .vtour-header {
      animation: fadeSlideUp 650ms ease both;
    }

    .vtour-wrapper {
      animation: fadeSlideUp 850ms ease both;
      animation-delay: 120ms;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 18px 22px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(245, 158, 11, 0.28);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(120, 53, 15, 0.10);
      margin-bottom: 18px;
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #78350f;
      text-align: center;
    }

    .top-bar__actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .go-home,
    .minimap-btn {
      border: 1px solid rgba(245, 158, 11, 0.45);
      background: #b45309;
      color: white;
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: 250ms ease;
      box-shadow: 0 12px 25px rgba(120, 53, 15, 0.16);
      text-decoration: none;
    }

    .go-home:hover,
    .minimap-btn:hover {
      background: #92400e;
      transform: translateY(-2px);
    }

    #panorama {
      width: 100%;
      height: calc(100vh - 225px);
      min-height: 520px;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(245, 158, 11, 0.35);
      box-shadow: 0 24px 60px rgba(120, 53, 15, 0.18);
      background: #111827;
    }

    .scenes {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 18px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 22px;
      box-shadow: 0 14px 35px rgba(120, 53, 15, 0.08);
    }

    .scenes button {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #fef3c7;
      color: #78350f;
      font-weight: 800;
      border: 1px solid rgba(245, 158, 11, 0.45);
      transition: 220ms ease;
    }

    .scenes button:hover {
      background: #b45309;
      color: white;
      transform: translateY(-2px);
    }

    .minimap-modal {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(24, 24, 27, 0.72);
      z-index: 9998;
      padding: 24px;
    }

    .minimap-modal.active {
      display: flex;
    }

    .minimap-img {
      max-width: min(95vw, 900px);
      max-height: 90vh;
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      border: 4px solid #f7f1e8;
    }

    .coord-hint {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 20;
      background: rgba(24, 24, 27, 0.78);
      color: white;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 13px;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
    }

    @media (max-width: 768px) {
      .top-bar {
        justify-content: center;
        text-align: center;
      }

      #panorama {
        height: calc(100vh - 285px);
        min-height: 420px;
        border-radius: 22px;
      }

      .side-menu {
        width: 260px;
        padding: 105px 20px 24px;
      }
    }

    @media (max-width: 640px) {
      footer .footer-container {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const body = document.body;
  const overlay = document.getElementById("pageOverlay");

  const menuBtn = document.getElementById("menuBtn");
  const menuIcon = document.getElementById("menuIcon");
  const mobileMenu = document.getElementById("mobileMenu");
  const menuBackdrop = document.getElementById("menuBackdrop");

  if (menuBtn && mobileMenu && menuIcon && menuBackdrop) {
    menuBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();

      mobileMenu.classList.toggle("open");
      menuBackdrop.classList.toggle("open");
      body.classList.toggle("menu-open");

      menuIcon.textContent = mobileMenu.classList.contains("open") ? "×" : "☰";
    });

    menuBackdrop.addEventListener("click", () => {
      mobileMenu.classList.remove("open");
      menuBackdrop.classList.remove("open");
      body.classList.remove("menu-open");
      menuIcon.textContent = "☰";
    });
  }

  const links = document.querySelectorAll('a[href]:not([href^="#"]):not([target="_blank"])');

  links.forEach(link => {
    link.addEventListener("click", function (e) {
      const href = this.getAttribute("href");
      if (!href || href.startsWith("javascript:")) return;

      e.preventDefault();

      body.classList.add("is-leaving");
      if (overlay) overlay.classList.add("is-active");

      setTimeout(() => {
        window.location.href = href;
      }, 420);
    });
  });

  window.addEventListener("pageshow", () => {
    body.classList.remove("is-leaving");
    body.classList.remove("menu-open");
    if (overlay) overlay.classList.remove("is-active");
  });
});
</script>

  function showMinimap() {
    document.getElementById('minimapModal').classList.add('active');
  }

  function hideMinimap() {
    document.getElementById('minimapModal').classList.remove('active');
  }

  const panoramaEl = document.getElementById('panorama');
  const coordDiv = document.createElement('div');
  coordDiv.className = 'coord-hint';
  coordDiv.textContent = 'Klik panorama untuk koordinat';

  if (panoramaEl) {
    panoramaEl.appendChild(coordDiv);
  } else {
    document.body.appendChild(coordDiv);
  }

  const toggleBtn = document.getElementById('toggleDragBtn');
  const viewerContainer = typeof viewer.getContainer === 'function'
    ? viewer.getContainer()
    : panoramicFallback();

  let dragEnabled = true;

  function panoramicFallback() {
    return panoramaEl.querySelector('.pnlm-container') || panoramaEl;
  }

  function setCoordHint(message) {
    coordDiv.textContent = message;
  }

  function showCoords(event) {
    const coords = viewer.mouseEventToCoords(event);

    if (coords && Number.isFinite(coords.yaw) && Number.isFinite(coords.pitch)) {
      coordDiv.textContent = `Yaw: ${coords.yaw.toFixed(2)}, Pitch: ${coords.pitch.toFixed(2)}`;
    } else {
      const fallbackYaw = typeof viewer.getYaw === 'function' ? viewer.getYaw() : NaN;
      const fallbackPitch = typeof viewer.getPitch === 'function' ? viewer.getPitch() : NaN;

      if (Number.isFinite(fallbackYaw) && Number.isFinite(fallbackPitch)) {
        coordDiv.textContent = `Yaw: ${fallbackYaw.toFixed(2)}, Pitch: ${fallbackPitch.toFixed(2)}`;
      } else {
        setCoordHint('Tidak dapat membaca koordinat');
      }
    }
  }

  function handlePointer(event) {
    if (!dragEnabled) {
      showCoords(event);
      event.stopPropagation();
      event.preventDefault();
    }
  }

  function handleScroll(event) {
    if (!dragEnabled) {
      event.stopPropagation();
      event.preventDefault();
    }
  }

  const wheelListenerOptions = { capture: true, passive: false };

  function disableDrag() {
    dragEnabled = false;
    panoramaEl.style.cursor = 'pointer';
    viewerContainer.style.cursor = 'pointer';
    viewerContainer.addEventListener('mousedown', handlePointer, true);
    viewerContainer.addEventListener('touchstart', handlePointer, true);
    viewerContainer.addEventListener('click', handlePointer, true);
    viewerContainer.addEventListener('touchend', handlePointer, true);
    viewerContainer.addEventListener('wheel', handleScroll, wheelListenerOptions);
    toggleBtn.textContent = 'Aktifkan Drag';
    setCoordHint('Mode koordinat aktif — klik panorama');
  }

  function enableDrag() {
    dragEnabled = true;
    panoramaEl.style.cursor = 'grab';
    viewerContainer.style.cursor = 'grab';
    viewerContainer.removeEventListener('mousedown', handlePointer, true);
    viewerContainer.removeEventListener('touchstart', handlePointer, true);
    viewerContainer.removeEventListener('click', handlePointer, true);
    viewerContainer.removeEventListener('touchend', handlePointer, true);
    viewerContainer.removeEventListener('wheel', handleScroll, wheelListenerOptions);
    toggleBtn.textContent = 'Nonaktifkan Drag';
    setCoordHint('Klik panorama untuk koordinat');
  }

  toggleBtn.onclick = function() {
    if (dragEnabled) {
      disableDrag();
    } else {
      enableDrag();
    }
  };

  enableDrag();

  document.addEventListener('click', () => {
    document.querySelectorAll('.hotspot-alert.is-open').forEach((node) => node.classList.remove('is-open'));
  });
